name: Sync Shopee Collection

on:
  push:
    branches: [main]
    paths:
      - 'scrape.mjs'
      - '.github/workflows/sync-products.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Scrape collection
        run: node scrape.mjs

      - name: Commit synced data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json scrape-debug.json scrape-page.html scrape-page.png
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Sync Shopee collection"
            git push
          fi
